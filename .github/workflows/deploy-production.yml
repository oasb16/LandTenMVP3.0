name: Deploy to Production

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Python dependencies
        run: pip install boto3 requests stripe

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup AWS Infrastructure
        run: python scripts/setup_production.py
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          STAGE: prod

      - name: Deploy Backend to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh
          export HEROKU_API_KEY=${{ secrets.HEROKU_API_KEY }}
          heroku git:remote -a landtenmvp3 || true
          HUSKY=0 git push heroku HEAD:main
          heroku config:set \
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            AWS_REGION=us-east-1 \
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }} \
            -a landtenmvp3

      - name: Setup Stripe Webhook
        run: python scripts/setup_stripe_webhook.py
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}

      - name: Deploy Frontend to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: |
          cd frontend
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel --prod --token=$VERCEL_TOKEN \
            -e NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY

      - name: Run Health Checks
        run: python scripts/test_production_flow.py

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "Frontend: https://land-ten-mvp-3-0.vercel.app"
          echo "Backend: https://landtenmvp3-55ce0053f28a.herokuapp.com"

      - name: Notify Failure
        if: failure()
        run: echo "❌ Deployment failed. Check logs above."
