version: '3.8'

services:
  # ================================================
  # LocalStack - Local AWS Services (DynamoDB, S3)
  # ================================================
  localstack:
    image: localstack/localstack:latest
    container_name: landten-localstack
    ports:
      - "4566:4566"  # LocalStack gateway
      - "4571:4571"  # DynamoDB
    environment:
      - SERVICES=dynamodb,s3
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - localstack-data:/tmp/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - landten-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================================
  # Backend - FastAPI Application
  # ================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: landten-backend
    ports:
      - "8000:8080"
    environment:
      # Auth
      - AUTH_DISABLED=${AUTH_DISABLED:-true}

      # AWS Configuration
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - DYNAMODB_ENDPOINT=http://localstack:4566
      - S3_ENDPOINT=http://localstack:4566

      # S3 Buckets
      - S3_BUCKET_INCIDENT_PHOTOS=${S3_BUCKET_INCIDENT_PHOTOS:-landten-incident-photos}
      - S3_BUCKET_JOB_COMPLETION_PHOTOS=${S3_BUCKET_JOB_COMPLETION_PHOTOS:-landten-job-completion-photos}

      # Stripe
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PLATFORM_FEE_PERCENT=${STRIPE_PLATFORM_FEE_PERCENT:-15}

      # Stream Chat
      - STREAM_CHAT_API_KEY=${STREAM_CHAT_API_KEY}
      - STREAM_CHAT_API_SECRET=${STREAM_CHAT_API_SECRET}

      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY}

      # JWT
      - JWT_SECRET=${JWT_SECRET:-dev_secret_key}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEBUG_MODE=${DEBUG_MODE:-false}
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - landten-network
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================================
  # Frontend - Next.js Application
  # ================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000}
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    container_name: landten-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8080
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-dev_nextauth_secret}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - landten-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  landten-network:
    driver: bridge

volumes:
  localstack-data:
    driver: local
